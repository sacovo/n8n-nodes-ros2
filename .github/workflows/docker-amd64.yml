name: Build amd64 image

# The GitLab pipeline builds this same Dockerfile on arm64 runners for the
# Jetson. Nothing there produces an amd64 image, so the public demo on an
# x86 server had nothing to pull. This workflow fills exactly that gap:
# GitLab keeps arm64 for the robot, GitHub builds amd64 for the demo.
#
# The result is the complete runtime image — n8n plus this node package
# installed — so the demo host pulls it and never builds anything itself.
# That matters: the demo box is 2 vCPU / 3 GB and compiling n8n from source
# on it is not realistic.

on:
  push:
    branches: [main]
    paths:
      - 'docker/n8n/**'
      - 'nodes/**'
      - 'credentials/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/docker-amd64.yml'
  workflow_dispatch:

concurrency:
  # A newer commit supersedes an in-flight build; these runs are long.
  group: docker-amd64-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Building n8n from source on a 2-core runner is slow; the default 360 is
    # the ceiling anyway, this just fails faster if something hangs.
    timeout-minutes: 180

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The n8n monorepo plus pnpm's store and two node:24-trixie layers do not
      # fit in the ~14 GB a hosted runner starts with. These four directories
      # are irrelevant here and buy back roughly 25 GB.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `n8n-` prefixed to match the GitLab pipeline's naming, so the two
          # registries stay legible side by side.
          tags: |
            type=raw,value=n8n-amd64
            type=raw,value=n8n-${{ github.ref_name }}
            type=sha,prefix=n8n-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/n8n/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Stage 1 clones a pinned commit of sacovo/n8n, so it is
          # deterministic and the layer cache hits on every later run — the
          # difference between ~an hour and a few minutes.
          cache-from: type=gha,scope=n8n
          cache-to: type=gha,mode=max,scope=n8n

      - name: Summary
        run: |
          {
            echo '### amd64 image pushed'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
